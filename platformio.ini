[env:m5stickc-plus]
platform = espressif32 @ 6.9.0
board = m5stick-c
board_build.psram = enable
board_build.psram_type = qspi
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
extra_scripts = scripts/patch_dfr.py
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus2
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:hosyond-es3c28p]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram = enable
board_build.psram_type = opi
board_build.f_cpu = 160000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DHERMES_BOARD_HOSYOND_ES3C28P
    -DHERMES_DISPLAY_W=240
    -DHERMES_DISPLAY_H=320
    -DHERMES_LED_PIN=42
    -DHERMES_RECORD_SAMPLE_RATE=16000
extra_scripts = scripts/patch_dfr.py
build_src_filter = +<*> +<buddies/>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.7
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
